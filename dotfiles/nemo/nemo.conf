[general]
gtk-theme-name=Adwaita-dark
icon-theme-name=Adwaita-icon-theme

# Standard View Settings
default-view=small-icons
show-hidden-files=false
show-backup-files=true
show-preview-images=true
show-preview-sounds=false
show-preview-videos=true
show-preview-text=true

# Navigation & Behavior
enable-search-as-you-type=true
click-to-rename=false
open-folder-in-new-window=false
open-folder-in-tab=true
enable-undo=true
enable-undo-limit=100
enable-trash-undo=true

# Tree View (Sidebar)
sidebar-show-hidden-files=false
sidebar-root-folder=/
sidebar-width=200
sidebar-tree-show-hidden-files=false
sidebar-tree-open-on-hover=false
sidebar-tree-open-on-hover-delay=500

# Status Bar
show-statusbar=true
show-space-info=true
show-selection-info=true

# Toolbar
show-toolbar=true
toolbar-style=both-horiz

# Desktop Integration (Disable if you use another desktop environment)
# Set to false if you don't want Nemo managing your desktop icons
show-desktop-icons=false

# Search
search-results-order-by=name
search-results-sort-order=ascending
search-results-show-hidden=true
search-results-show-mime=false
search-results-show-size=true
search-results-show-date=false

# File Operations
confirm-delete=false
confirm-trash=false
confirm-overwrite=true
use-trash=true

# Preview Settings
preview-size=128
preview-text=true
preview-images=true
preview-sounds=false
preview-videos=true
