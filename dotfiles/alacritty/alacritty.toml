# ~/.config/alacritty/alacritty.toml

[window]
padding = { x = 16, y = 16 }
decorations = "Full"
opacity = 0.85

[font]
normal = { family = "JetBrainsMono Nerd Font Mono", style = "Regular" }
bold = { family = "JetBrainsMono Nerd Font Mono", style = "Bold" }
italic = { family = "JetBrainsMono Nerd Font Mono", style = "Italic" }
bold_italic = { family = "JetBrainsMono Nerd Font Mono", style = "Bold Italic" }
size = 11.0

[bell]
animation = "EaseOutExpo"
duration = 0
command = { program = "none" }

[colors.primary]
background = "#1a1b26"
foreground = "#a9b1d6"
dim_foreground = "#787c99"
bright_foreground = "#c4c9e2"

[colors.cursor]
text = "#1a1b26"
cursor = "#ff9e64"

[colors.vi_mode_cursor]
text = "#1a1b26"
cursor = "#7aa2f7"

[colors.search]
matches = { foreground = "#000000", background = "#c0caf5" }
focused_match = { foreground = "#000000", background = "#7aa2f7" }

[colors.hints]
start = { foreground = "#1a1b26", background = "#e0af68" }
end = { foreground = "#1a1b26", background = "#7aa2f7" }

[colors.line_indicator]
foreground = "#1a1b26"
background = "#7aa2f7"

[colors.footer_bar]
foreground = "#1a1b26"
background = "#7aa2f7"

[colors.selection]
text = "#1a1b26"
background = "#c0caf5"

[colors.normal]
black = "#1a1b26"
red = "#f7768e"
green = "#9ece6a"
yellow = "#e0af68"
blue = "#7aa2f7"
magenta = "#bb9af7"
cyan = "#7dcfff"
white = "#a9b1d6"

[colors.bright]
black = "#414868"
red = "#f7768e"
green = "#9ece6a"
yellow = "#e0af68"
blue = "#7aa2f7"
magenta = "#bb9af7"
cyan = "#7dcfff"
white = "#c0caf5"

[colors.dim]
black = "#1a1b26"
red = "#f7768e"
green = "#9ece6a"
yellow = "#e0af68"
blue = "#7aa2f7"
magenta = "#bb9af7"
cyan = "#7dcfff"
white = "#a9b1d6"

[scrolling]
history = 10000
multiplier = 100
